[project]
name = "ascend-server"
version = "0.1.0"
description = "Ascend token feed backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.14.0",
    "curl-cffi==0.15.0",
    "fastapi==0.136.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.13",
    "pydantic==2.13.2",
    "pydantic-core==2.46.2",
    "pydantic-settings==2.14.0",
    "PyJWT==2.12.1",
    "SQLAlchemy[asyncio]==2.0.49",
    "uvicorn[standard]==0.46.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "ASYNC"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "-p no:cacheprovider --import-mode=importlib"
markers = ["integration: isolated database and transport tests"]

[tool.ruff.format]
exclude = ["migrations/versions/*.py"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["I001"]
"migrations/versions/801c5e2b52e7_added_revoked_at_api_keys.py" = ["E501"]

[tool.ruff]
target-version = "py311"
line-length = 79

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "ASYNC"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider --import-mode=importlib"
markers = ["integration: isolated database and transport tests"]

[tool.ruff.format]
exclude = ["migrations/versions/*.py"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["I001"]
"migrations/versions/801c5e2b52e7_added_revoked_at_api_keys.py" = ["E501"]
